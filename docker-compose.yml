services:
  downloader:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # Mount downloads directory to persist files
      - ./downloads:/app/downloads
      # Mount .env file if it exists
      - ./.env:/app/.env:ro
    environment:
      # You can also set environment variables directly here
      # REAL_DEBRID_API_KEY: your_api_key_here
      - FLASK_ENV=production
    restart: unless-stopped
    # Optional: set container name
    container_name: file_downloader
    # Optional: limit resources
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M